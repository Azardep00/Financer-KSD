spring.application.name=financer-ksd-api
server.port=${PORT:8080}

# Base de datos (sobrescribe con variables de entorno en produccion)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/financer_ksd}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

# JWT
jwt.secret=${JWT_SECRET:financer-ksd-clave-de-desarrollo-cambiar-en-produccion-32}
jwt.expiracion-ms=86400000

# CORS (origenes de los frontends, separados por coma)
app.cors.origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:5173}

# Asesor inicial (se crea solo si no existe ningun usuario). CAMBIAR en produccion.
app.admin.nombre=Admin
app.admin.apellido=Financer
app.admin.correo=${ADMIN_CORREO:admin@financerksd.com}
app.admin.contrasena=${ADMIN_CONTRASENA:Admin123!}
