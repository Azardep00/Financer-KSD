# Postgres local para desarrollo:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: financer_ksd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
